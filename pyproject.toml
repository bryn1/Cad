[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "cad"
version = "0.1.0"
description = "CAD-file converter (svarkor-ai/Cad) — B-rep core + IGES + B-rep/vector + mesh output + registry dispatch + FastAPI web shell (cad-api C8)"
requires-python = ">=3.11"
dependencies = [
    "cadquery>=2.8.0",
    "numpy>=1.26",
    "trimesh==5.0.0",
    "networkx>=3.0",
    "lxml>=5.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
test = ["pytest>=8", "httpx>=0.27"]

[tool.setuptools]
packages = ["cad", "server"]

[tool.setuptools.package-dir]
"" = "."
